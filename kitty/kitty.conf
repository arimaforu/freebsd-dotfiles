font_family DejaVu Sans Mono
font_size 11

# Main colors
background #0B0C0F
foreground #E6E6E6
cursor #00E6D0
cursor_text_color #0B0C0F

# Completely opaque
background_opacity 1.0
dynamic_background_opacity no
background_image none

# Selection
selection_background #00E6D0
selection_foreground #0B0C0F

# ANSI colors — same basic palette as the old terminal
color0  #0B0C0F
color1  #CD0000
color2  #00CD00
color3  #CDCD00
color4  #0000EE
color5  #CD00CD
color6  #00CDCD
color7  #E6E6E6

color8  #707780
color9  #FF0000
color10 #00FF00
color11 #FFFF00
color12 #5C5CFF
color13 #FF00FF
color14 #00E6D0
color15 #FFFFFF

# Window
window_padding_width 8
window_border_width 0
draw_minimal_borders yes
draw_window_borders_for_single_window no

# Keep kitty border cyan instead of default green
active_border_color #00E6D0
inactive_border_color #202020
bell_border_color #00E6D0

scrollback_lines 5000
enable_audio_bell no
confirm_os_window_close 0
