[colors]
bg = #0b0c0f
fg = #e6e6e6
muted = #70757d
accent = #00e6d0
line = #25282d

[bar/y2k]
width = 100%
height = 28

offset-x = 0
offset-y = 0

background = ${colors.bg}
foreground = ${colors.fg}

radius = 0
border-size = 0

padding-left = 4
padding-right = 4

module-margin-left = 0
module-margin-right = 0

font-0 = DejaVu Sans:size=9;2
font-1 = Font Awesome 7 Free Solid:size=9;2

modules-left = freebsd bspwm
modules-center = xwindow
modules-right = network volume xkeyboard cpu memory date window-minimize window-maximize window-close

enable-ipc = true


[module/freebsd]
type = custom/text

content = "◆ FREEBSD"
content-foreground = ${colors.fg}
content-padding = 3

click-left = rofi -show drun -theme ~/.config/rofi/theme.rasi


[module/bspwm]
type = internal/bspwm

pin-workspaces = true
enable-click = true
enable-scroll = true

label-focused = %name%
label-focused-foreground = ${colors.fg}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.fg}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2


[module/network]
type = custom/script

exec = ~/.config/polybar/scripts/network.sh
interval = 2

format = <label>
label = %output%
label-foreground = ${colors.fg}
label-padding = 2

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
tail = true

label = %output%
label-padding = 2

click-left = mixer vol.mute=toggle
scroll-up = mixer vol=+5%
scroll-down = mixer vol=-5%

[module/cpu]
type = internal/cpu

interval = 2

label = CPU %percentage%%
label-foreground = ${colors.fg}
label-padding = 2


[module/memory]
type = internal/memory

interval = 2

label = RAM %percentage_used%%
label-foreground = ${colors.fg}
label-padding = 2


[module/date]
type = internal/date
interval = 1

date = %d.%m.%Y
time = %H:%M

label = %time%  %date%
label-foreground = ${colors.fg}
label-padding = 2

date-alt = %A, %d %B %Y
time-alt = %H:%M:%S

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = caps lock
blacklist-2 = scroll lock

format = <label-layout>

label-layout = %icon%
label-layout-foreground = ${colors.fg}
label-layout-padding = 2

layout-icon-0 = us;EN
layout-icon-1 = ru;RU

[module/xwindow]
type = custom/script

exec = ~/.config/polybar/scripts/window-title.sh
interval = 0.5

format = <label>
label = %output%
label-foreground = ${colors.fg}
label-padding = 2

[module/window-minimize]
type = custom/text
content = "—"
content-foreground = ${colors.fg}
content-padding = 3
click-left = xdotool getactivewindow windowminimize

[module/window-maximize]
type = custom/text
content = "□"
content-foreground = ${colors.fg}
content-padding = 3
click-left = bspc node -t ~fullscreen

[module/window-close]
type = custom/text
content = "×"
content-foreground = ${colors.fg}
content-padding = 3
click-left = bspc node -c
